name: Cross-platform desktop builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: next-electron-ide

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            label: Linux
            artifact: linux
          - os: windows-latest
            platform: win
            label: Windows
            artifact: windows
          - os: macos-latest
            platform: mac
            label: macOS
            artifact: macos

    # CI produces unsigned artifacts. Signing/notarization can be enabled later
    # by adding the platform certificates as repository secrets.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-electron-ide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package desktop application
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexide-${{ matrix.artifact }}
          path: next-electron-ide/release/*
          if-no-files-found: error
